name: Publicar parche Shorebird

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Rama del hotfix
        type: string
        default: master
        required: true
      source_ref:
        description: SHA inmutable a parchar
        type: string
        required: true
      platforms:
        description: Plataformas
        type: choice
        options: [both, android, ios]
        default: both
        required: true

permissions:
  contents: write

jobs:
  patch:
    uses: mastercelta/bees-mobile-workflows/.github/workflows/shorebird-patch.yml@v1
    with:
      source_branch: ${{ inputs.source_branch }}
      source_sha: ${{ inputs.source_ref }}
      platforms: ${{ inputs.platforms }}
      bundle_id: ${{ vars.STORE_BUNDLE_ID }}
      android_signing_ref: ${{ vars.ANDROID_SIGNING_REF }}
      ios_signing_ref: ${{ vars.IOS_SIGNING_REF }}
      shorebird_enabled: ${{ vars.SHOREBIRD_ENABLED == 'true' }}
    secrets: inherit
